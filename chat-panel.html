<div class="bp-panel-content">
    <!-- Title bar with action icons -->
    <div class="bp-panel-title">
        <b>BurnerPhone</b>
        <span id="bp_active_char_label" class="bp-header-label"></span>
        <div class="bp-header-icons">
            <div id="bpExport" class="fa-solid fa-download hoverglow bp-header-icon" title="Export conversation"></div>
            <div id="bpImport" class="fa-solid fa-upload hoverglow bp-header-icon" title="Import conversation"></div>
            <input id="bpImportFile" type="file" accept=".json" style="display:none;">
            <div id="bpViewPrompt" class="fa-solid fa-eye hoverglow bp-header-icon" title="View last prompt"></div>
            <div id="bpClearChat" class="fa-solid fa-trash-can hoverglow bp-header-icon" title="Clear conversation"></div>
        </div>
    </div>

    <!-- From / To identity row with picker dropdowns -->
    <div class="bp-identity-row">
        <div class="bp-identity-field">
            <label for="bp_from">From</label>
            <div class="bp-picker-wrapper">
                <input id="bp_from" class="text_pole" placeholder="Me" autocomplete="off">
                <div id="bp_from_dropdown" class="bp-picker-dropdown" style="display:none;"></div>
            </div>
        </div>
        <div class="bp-identity-field">
            <label for="bp_to">To</label>
            <div class="bp-picker-wrapper">
                <input id="bp_to" class="text_pole" placeholder="Character name..." autocomplete="off">
                <div id="bp_to_dropdown" class="bp-picker-dropdown" style="display:none;"></div>
            </div>
        </div>
        <div id="bp_start_convo" class="menu_button bp-start-btn" title="Start conversation">
            <i class="fa-solid fa-arrow-right"></i>
        </div>
    </div>

    <!-- Conversation list -->
    <div id="bp_convo_list" class="bp-convo-list" style="display: none;"></div>

    <!-- Active conversation header -->
    <div id="bp_active_header" class="bp-active-header" style="display: none;">
        <div class="bp-active-names">
            <span id="bp_active_from" class="bp-active-name"></span>
            <i class="fa-solid fa-arrow-right bp-arrow-icon"></i>
            <span id="bp_active_to" class="bp-active-name"></span>
        </div>
        <div class="bp-toggles">
            <select id="bp_toggle_context_mode" class="text_pole bp-context-select"
                    title="PM context awareness: what the PM character knows">
                <option value="isolated">Isolated</option>
                <option value="lore">Lore only</option>
                <option value="full">Full</option>
            </select>
            <label class="checkbox_label bp-toggle-label" for="bp_toggle_story_sees"
                   title="Main chat / story generation includes PM conversation (group: only target character)">
                <input id="bp_toggle_story_sees" type="checkbox">
                <span>Story sees PM</span>
            </label>
        </div>
    </div>

    <!-- Chat Messages Area -->
    <div id="bp_chat_area" class="bp-chat-area">
        <div id="bp_chat_messages" class="bp-chat-messages">
            <div class="bp-empty-state">Pick a character to start a conversation.</div>
        </div>
    </div>

    <!-- Input Area -->
    <div id="bp_input_area" class="bp-input-area" style="display: none;">
        <textarea id="bp_input" class="text_pole bp-input-text" placeholder="Type a message..." rows="2"></textarea>
        <div id="bp_send" class="menu_button bp-send-btn" title="Send (Enter)">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <div id="bp_cancel" class="menu_button bp-cancel-btn" title="Cancel generation" style="display: none;">
            <i class="fa-solid fa-xmark"></i>
        </div>
    </div>

    <!-- Status -->
    <div id="bp_status" class="bp-status"></div>
</div>
